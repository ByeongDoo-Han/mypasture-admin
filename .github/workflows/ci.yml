name: Admin CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ci:
    name: admin-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare production environment
        run: cp .env.prod.example .env.prod

      - name: Build production bundle
        run: npm run build:prod

      - name: Build and smoke test production container
        run: |
          set -euo pipefail
          docker build --tag mypasture-admin:ci .
          docker run --detach --name mypasture-admin-ci \
            --publish 127.0.0.1:18080:8080 \
            --env APP_ENV=prod \
            --env API_BASE_URL=https://api.invalid \
            mypasture-admin:ci
          trap 'docker rm --force mypasture-admin-ci >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 2 --max-time 5 http://127.0.0.1:18080/api/health \
            | grep --fixed-strings '"status":"UP"'
